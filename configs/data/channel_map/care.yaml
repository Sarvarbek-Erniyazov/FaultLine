# Channel map: CARE farms A/B/C
#
# Maps each canonical FaultLine channel onto the column name published by the source.
# A value of null or a TODO string means the mapping is unresolved and the channel is
# skipped by the adapter rather than guessed at.
#
# CARE channels are anonymised (sensor_NN), so there is no name to match on. The
# mapping needs the record README and, where that is not enough, distributional
# matching against the named sources -- for example identifying the power channel by
# its relationship to the wind-speed channel. Until that is done and written up, CARE
# contributes labelled events and evaluation only, never training telemetry.
# Guessing a sensor identity here would corrupt the label cross-check that is CARE's
# entire purpose.

source: care
site: "CARE farms A/B/C"
mapping_status: "anonymised - TODO(m1)"

channels:
  wind_speed_ms: null # TODO(m1)
  power_kw: null # TODO(m1)
  rotor_speed_rpm: null # TODO(m1)
  generator_speed_rpm: null # TODO(m1)
  pitch_angle_deg: null # TODO(m1)
  nacelle_position_deg: null # TODO(m1)
  wind_direction_deg: null # TODO(m1)
  ambient_temp_c: null # TODO(m1)
  nacelle_temp_c: null # TODO(m1)
  gearbox_bearing_temp_c: null # TODO(m1)
  gearbox_oil_temp_c: null # TODO(m1)
  generator_bearing_temp_c: null # TODO(m1)
  generator_winding_temp_c: null # TODO(m1)
  # Appended to the canonical list on 2026-09-09 after the Kelmarsh signal-mapping
  # cross-check found a published main-shaft bearing temperature. Declared here so
  # that this map states 14 open questions rather than 13, and so the card counts
  # against the canonical list rather than against a stale copy of it.
  main_bearing_temp_c: null # TODO(m1)
