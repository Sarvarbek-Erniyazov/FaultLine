# Channel map: Kelmarsh
#
# Maps each canonical FaultLine channel onto the column name published by the source.
# A value of null means the mapping is unresolved and the adapter skips that channel
# rather than guessing at it.
#
# Two sources of truth, cross-checked against each other on 2026-09-09:
#
#   1. the header row of Turbine_Data_Kelmarsh_<n>_<period>.csv inside the staged
#      Kelmarsh_SCADA_<year>_*.zip archives (299 columns, Greenbyte export, UTF-8) --
#      every name below was verified to exist there verbatim;
#   2. Kelmarsh_WT_dataSignalMapping.csv, which gives the manufacturer definition of
#      each Greenbyte signal -- this is what establishes what a column *measures*, as
#      opposed to merely that it exists.
#
# See reports/data/raw_inventory_kelmarsh_20260908.md.

source: kelmarsh
site: "Kelmarsh"
mapping_status: "resolved: 13 of 14 mapped and confirmed; 1 verified absent from the record"

# Confirmed from the file preamble ("# Time zone: UTC"), which settles the timezone
# question the source specification raised for this record.
timezone: "UTC"

channels:
  wind_speed_ms: "Wind speed (m/s)"
  power_kw: "Power (kW)"
  rotor_speed_rpm: "Rotor speed (RPM)"
  generator_speed_rpm: "Generator RPM (RPM)"

  # Three pitch columns exist, one per blade: "... A (°)", "... B (°)", "... C (°)".
  # Blade A is taken as the canonical single-channel pitch. TODO(m1): decide whether
  # the model should see all three -- a disagreement between blades is itself a fault
  # signature, and collapsing to one blade discards it.
  pitch_angle_deg: "Blade angle (pitch position) A (°)"

  nacelle_position_deg: "Nacelle position (°)"
  wind_direction_deg: "Wind direction (°)"

  # Two plausible ambient sensors exist. CONFIRMED by the signal mapping: this one is
  # "Outdoor temp. nacelle", while "Ambient temperature (converter)" is "Temperature of
  # converter inlet air" -- cabinet air, not outdoor air.
  ambient_temp_c: "Nacelle ambient temperature (°C)"

  # CONFIRMED by the signal mapping: "Inside temperature nacelle".
  nacelle_temp_c: "Nacelle temperature (°C)"

  # VERIFIED ABSENT, not merely unmapped. The signal mapping resolves every bearing
  # column on this machine, and none of them is a gearbox bearing:
  #   Front bearing temperature -> "Axle bearing temperature 1"   (main shaft)
  #   Rear bearing temperature  -> "Axle bearing temperature 2"   (main shaft)
  #   Rotor bearing temp        -> "Temperature of rotor bearing" (main bearing)
  # Kelmarsh publishes no gearbox bearing temperature. This is a fact about the record
  # rather than a gap in this file, and it is exactly the kind of per-site channel
  # absence the modality-shift evaluation has to handle.
  gearbox_bearing_temp_c: null

  # CONFIRMED by the signal mapping: "Gear oil temperature".
  gearbox_oil_temp_c: "Gear oil temperature (°C)"

  # CONFIRMED: front is "Temperature of bearing 1", rear is "Temperature of bearing 2".
  # Front is taken as canonical. TODO(m1): consider carrying both, as with pitch.
  generator_bearing_temp_c: "Generator bearing front temperature (°C)"

  # CONFIRMED by the signal mapping: "Temperature for generator stator", which is the
  # generator winding temperature on this machine.
  generator_winding_temp_c: "Stator temperature 1 (°C)"

  # CONFIRMED by the signal mapping: signal 447, "Temperature of rotor bearing",
  # degC. On an MM92 the rotor bearing is the main shaft bearing, which is what this
  # canonical channel names. Distinct from the two axle bearing temperatures
  # ("Front"/"Rear bearing temperature" -> "Axle bearing temperature 1"/"2"), which
  # stay unmapped: carrying all three is an M1 feature question, and this one is the
  # channel the signal mapping names unambiguously.
  main_bearing_temp_c: "Rotor bearing temp (°C)"

# Columns identified but deliberately left outside the canonical channel set, recorded
# so that the exclusion is a visible decision rather than an oversight.
observed_but_unmapped:
  - "Gearbox speed (RPM)"
  - "Gear oil inlet temperature (°C)"
  - "Gear oil inlet pressure (bar)"
  - "Gear oil pump pressure (bar)"
  - "Generator bearing rear temperature (°C)"
  - "Blade angle (pitch position) B (°)"
  - "Blade angle (pitch position) C (°)"
  - "Ambient temperature (converter) (°C)"
  - "Long Term Wind (m/s)"

# The export also publishes per-column aggregates such as "<channel>, Max (°C)",
# ", Min" and ", Standard deviation". They are excluded here: the 10-minute mean is the
# canonical value, and whether the spread columns earn their place is an M1 feature
# question, not a channel-mapping one.

# Findings from the cross-check that are not mapping decisions, recorded here because
# they affect M1 and would otherwise be lost:
#
# 1. RESOLVED 2026-09-09. Main-shaft bearing temperatures ARE published ("Axle
#    bearing temperature 1" and "2", plus "Temperature of rotor bearing"), and the
#    canonical channel list had no main-bearing channel, so a real drivetrain signal
#    was being discarded. main_bearing_temp_c was appended to the canonical list and
#    mapped above. Appended, not inserted: the channel list fixes the channel token
#    ids, and under ADR-0003 v2 the channel block is a fixed-capacity prefix, so an
#    append costs nothing and an insert would move every later id. Declared
#    "extended", not "core": it is confirmed present at Kelmarsh only.
#
# 2. Unit discrepancy in the provider metadata. The SCADA header says "Power (kW)"
#    while Kelmarsh_WT_dataSignalMapping.csv records the unit of signal 5 as "kWh".
#    A 10-minute average of active power is kW, so the mapping file is most likely
#    wrong -- but "most likely" is not verified.
#    TODO(m1): confirm against the power curve before trusting the magnitudes, since
#    the plausibility bound for power_kw depends on which one is right.
#
# 3. Rated power is 2050 kW and the model is a Senvion MM92, confirmed per turbine in
#    Kelmarsh_WT_static.csv. This matches the bound configured in telemetry_v0.yaml.
