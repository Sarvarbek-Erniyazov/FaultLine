# Channel map: Penmanshiel
#
# Maps each canonical FaultLine channel onto the column name published by the source.
# A value of null means the mapping is unresolved and the adapter skips that channel
# rather than guessing at it.
#
# Two sources of truth, cross-checked against each other on 2026-09-10, the same way
# the Kelmarsh map was:
#
#   1. the header row of every Turbine_Data_Penmanshiel_<nn>_<period>.csv inside the
#      14 staged Penmanshiel_SCADA_<year>_*.zip archives -- 98 turbine-year members,
#      70 with a 300-column header and 28 with a 363-column one. Every name below
#      exists verbatim in all 98;
#   2. Penmanshiel_WT_dataSignalMapping.xlsx (78 signals), which gives the
#      manufacturer definition of each Greenbyte signal -- what a column *measures*,
#      as opposed to merely that it exists. Signal ids are quoted below.
#
# Penmanshiel and Kelmarsh share a publisher and an export format. That was a reason
# to expect the same map, not evidence of it; the evidence is the two checks above,
# and they agree with Kelmarsh column for column.
# See reports/data/raw_inventory_penmanshiel_20260910.md.

source: penmanshiel
site: "Penmanshiel"
mapping_status: "resolved: 13 of 14 mapped and confirmed; 1 verified absent from the record"

# Stated in the preamble of all 98 Turbine_Data members ("# Time zone: UTC"), and
# MEASURED 2026-09-10: no daylight-saving fingerprint in 98 turbine-years
# (reports/data/resolved_penmanshiel_20260910.md).
timezone: "UTC"

channels:
  # Signal 1, "Wind speed", m/s.
  wind_speed_ms: "Wind speed (m/s)"

  # Signal 5, "Actual value of active power". This mapping file records it in kW,
  # agreeing with the header, and MEASURED kW on 2026-09-10: median p99.5 2,056 against
  # a rated 2,050 (reports/data/resolved_penmanshiel_20260910.md).
  power_pu: "Power (kW)"

  # Signal 54, "Value of rotor speed".
  rotor_speed_rpm: "Rotor speed (RPM)"

  # Signal 86, "Generator speed".
  generator_speed_rpm: "Generator RPM (RPM)"

  # Signals 80-82, "Pitch angle for blade 1/2/3". Blade A is the canonical single-channel
  # pitch, as at Kelmarsh, and the TODO(m1) there about carrying all three blades
  # applies here too.
  pitch_angle_deg: "Blade angle (pitch position) A (°)"

  # Signal 3, "Nacelle orientation".
  nacelle_position_deg: "Nacelle position (°)"

  # Signal 2, "Wind direction".
  wind_direction_deg: "Wind direction (°)"

  # Signal 24, "Outdoor temp. nacelle". "Ambient temperature (converter)" is signal
  # 359, "Temperature of converter inlet air" -- cabinet air, not outdoor air.
  ambient_temp_c: "Nacelle ambient temperature (°C)"

  # Signal 25, "Inside temperature nacelle".
  nacelle_temp_c: "Nacelle temperature (°C)"

  # VERIFIED ABSENT, not merely unmapped. None of the 78 signals in the mapping file is
  # a gearbox bearing temperature. The bearing temperatures it does define are:
  #   Front bearing temperature           (9)   -> "Axle bearing temperature 1"   (main shaft)
  #   Rear bearing temperature            (10)  -> "Axle bearing temperature 2"   (main shaft)
  #   Generator bearing front temperature (119) -> "Temperature of bearing 1"     (generator)
  #   Generator bearing rear temperature  (118) -> "Temperature of bearing 2"     (generator)
  #   Rotor bearing temp                  (447) -> "Temperature of rotor bearing" (rotor)
  # The same absence as Kelmarsh: neither Senvion record publishes a gearbox bearing
  # temperature, so this channel is missing at both training sites.
  gearbox_bearing_temp_c: null

  # Signal 178, "Gear oil temperature".
  gearbox_oil_temp_c: "Gear oil temperature (°C)"

  # Signal 119, "Temperature of bearing 1". Front is canonical, as at Kelmarsh.
  generator_bearing_temp_c: "Generator bearing front temperature (°C)"

  # Signal 22, "Temperature for generator stator".
  generator_winding_temp_c: "Stator temperature 1 (°C)"

  # Signal 447, "Temperature of rotor bearing": the same signal id and definition that
  # Kelmarsh maps as its main bearing.
  main_bearing_temp_c: "Rotor bearing temp (°C)"

# The manufacturer definition of each mapped signal, from
# Penmanshiel_WT_dataSignalMapping.xlsx, with its signal id. This is the evidence the
# channel report prints next to each column.
evidence:
  wind_speed_ms: "signal mapping 1: Wind speed"
  power_pu: "signal mapping 5: Actual value of active power (kW)"
  rotor_speed_rpm: "signal mapping 54: Value of rotor speed"
  generator_speed_rpm: "signal mapping 86: Generator speed"
  pitch_angle_deg: "signal mapping 80: Pitch angle for blade 1 (blade A of three)"
  nacelle_position_deg: "signal mapping 3: Nacelle orientation"
  wind_direction_deg: "signal mapping 2: Wind direction"
  ambient_temp_c: "signal mapping 24: Outdoor temp. nacelle"
  nacelle_temp_c: "signal mapping 25: Inside temperature nacelle"
  gearbox_bearing_temp_c: "none of the 78 signals in the mapping is a gearbox bearing temperature"
  gearbox_oil_temp_c: "signal mapping 178: Gear oil temperature"
  generator_bearing_temp_c: "signal mapping 119: Temperature of bearing 1 (front)"
  generator_winding_temp_c: "signal mapping 22: Temperature for generator stator"
  main_bearing_temp_c: "signal mapping 447: Temperature of rotor bearing"

# Canonical channels confirmed not to be published by this record, as opposed to not
# yet mapped. The core-set derivation (configs/data/telemetry_v1.yaml) reads this.
verified_absent:
  gearbox_bearing_temp_c: "none of the 78 signals in the mapping workbook is a gearbox bearing"
ambiguous: {}

# Columns seen in the header and deliberately left outside the canonical channel set,
# as at Kelmarsh, so the exclusion is a visible decision rather than an oversight.
observed_but_unmapped:
  - "Front bearing temperature (°C)"
  - "Rear bearing temperature (°C)"
  - "Generator bearing rear temperature (°C)"
  - "Gear oil inlet temperature (°C)"
  - "Gear oil inlet pressure (bar)"
  - "Gear oil pump pressure (bar)"
  - "Gearbox speed (RPM)"
  - "Blade angle (pitch position) B (°)"
  - "Blade angle (pitch position) C (°)"
  - "Ambient temperature (converter) (°C)"
