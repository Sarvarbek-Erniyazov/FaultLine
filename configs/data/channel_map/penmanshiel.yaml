# Maps each canonical FaultLine channel onto the column name published by the source.
# A value of null or a TODO string means the mapping is unresolved and the channel is
# skipped by the adapter rather than guessed at.
#
# Source of truth: Penmanshiel_WT_dataSignalMapping.xlsx, staged with tier 1.
# It ships as a workbook rather than a CSV, so it needs openpyxl to read; that is
# already a dependency. Not parsed at M0 (Zenodo outage during the staging window).
# Kelmarsh and Penmanshiel share a publisher, so the two maps are likely similar --
# likely is not verified, and each must be filled from its own mapping file.

