# Telemetry source specification.
#
# One entry per public SCADA dataset. Record ids are pinned to a *version*, not to
# the concept DOI, so that a new upload by the provider cannot silently change what
# a run consumed; the concept DOI is recorded alongside for citation. The downloader
# fails loudly if a configured file name is absent from the pinned record.
#
# Tiers exist because the full corpus is ~35 GB and this project runs on one
# workstation: tier 1 is the minimum that supports M1, tier 2 is everything else.
#
# Provenance of every value below: the Zenodo record metadata and the provider
# README of each record. Anything not established there is marked TODO(m1).

version: 0

defaults:
  api_base: "https://zenodo.org/api/records"
  # Verified against the checksum published in the record metadata (md5:<hex>).
  verify_checksums: true
  # Partial files are resumed with an HTTP Range request rather than restarted.
  resume: true

sources:
  kelmarsh:
    provider: "Cubico Sustainable Investments Ltd"
    zenodo_record: 16807551 # v4, published 2025-08-12
    concept_doi: "10.5281/zenodo.5841833"
    license: "CC-BY-4.0"
    attribution: "Cubico Sustainable Investments Ltd, Kelmarsh wind farm data, Zenodo, doi:10.5281/zenodo.5841833 (CC BY 4.0)"
    site:
      name: "Kelmarsh"
      country: "UK"
      oem: "Senvion MM92"
      n_turbines: 6
      rated_kw: 2050
      period: "2016-2024"
    # MEASURED 2026-09-09, not merely read. The preamble line "# Time zone: UTC" is a
    # claim by the exporter; the timestamps themselves were tested for the fingerprint
    # UK civil time leaves and cannot hide. Across all 54 staged turbine-years, every
    # spring-forward hour is fully populated and no autumn fall-back hour repeats a
    # label. Evidence: reports/data/resolved_kelmarsh_20260909.md.
    # Re-measured 2026-09-10 after the repeated-label rule (M1a step 4): the 2023 and 2024
    # exports, which the autumn half abstained on at M0, now get both halves, and the
    # verdict is UTC on all 54 turbine-years. reports/data/resolved_kelmarsh_20260910.md.
    timezone: "UTC"
    # The power column is in kW, MEASURED 2026-09-09. The provider's own signal
    # mapping records signal 5 ("Power" / "Actual value of active power") in kWh,
    # which contradicts the SCADA header's "Power (kW)" and would have moved the
    # plausibility bound by a factor of six. The median per-turbine-year p99.5 is
    # 2,057 kW against a rated 2,050 kW, six times what a 10-minute energy total
    # would reach; the record separately publishes "Energy Export (kWh)" for energy.
    # The mapping file's unit for signal 5 is wrong. Evidence, per turbine-year:
    # reports/data/resolved_kelmarsh_20260909.md.
    intended_use: "training / validation site"
    tiers:
      1:
        - "Kelmarsh_SCADA_2016_3082.zip"
        - "Kelmarsh_SCADA_2017_3083.zip"
        - "Kelmarsh_SCADA_2018_3084.zip"
        - "Kelmarsh_SCADA_2019_3085.zip"
        - "Kelmarsh_SCADA_2020_3086.zip"
        - "Kelmarsh_SCADA_2021_4456.zip"
        - "Kelmarsh_SCADA_2022_4457.zip"
        - "Kelmarsh_SCADA_2023_5961.zip"
        - "Kelmarsh_SCADA_2024_5962.zip"
        - "Kelmarsh_WT_dataSignalMapping.csv"
        - "Kelmarsh_WT_static.csv"
      2:
        - "Kelmarsh_PMU_4459.zip"
        - "Kelmarsh_PMU_2023_2024_5968.zip"
        - "Kelmarsh_Grid_Meter_4458.zip"
        - "Kelmarsh_12.3MW_6xSenvion_MM92.kmz"

  penmanshiel:
    provider: "Cubico Sustainable Investments Ltd"
    zenodo_record: 16807304 # v3, published 2025-08-13
    concept_doi: "10.5281/zenodo.5946807"
    license: "CC-BY-4.0"
    attribution: "Cubico Sustainable Investments Ltd, Penmanshiel wind farm data, Zenodo, doi:10.5281/zenodo.5946807 (CC BY 4.0)"
    site:
      name: "Penmanshiel"
      country: "UK"
      oem: "Senvion MM82"
      n_turbines: 14
      rated_kw: 2050
      period: "2016-2024"
      note: "turbine WT03 is absent from the record"
    # MEASURED 2026-09-10, not only declared: UTC across 98 turbine-years, and the power
    # column is kW (median p99.5 2,056 against a rated 2,050). The spring half does not
    # apply to the 14 turbine-years of 2016, because every turbine starts reporting in
    # June or July 2016 and there is no series running through the March hour.
    # Evidence: reports/data/resolved_penmanshiel_20260910.md.
    timezone: "UTC"
    # PREDICTION, recorded 2026-09-10 to be checked when tier 2 lands: the 2023-2024
    # exports (tier 2, not staged) repeat every 10-minute label about 41 times in
    # cumulative blocks, as Kelmarsh's 2023-2024 exports from the same publisher do. The
    # ingest collapses that layout only after proving it lossless, and its report states
    # rows_raw, rows_after_null_drop and labels_distinct per file, so the prediction is
    # confirmed or refuted by the first ingest that reads them.
    intended_use: "training / validation site"
    tiers:
