  hill_of_towie:
    provider: "RES on behalf of TRIG"
    zenodo_record: 14870023 # v1.0.0, single version
    concept_doi: "10.5281/zenodo.14870023"
    license: "CC-BY-4.0"
    attribution: "RES on behalf of The Renewables Infrastructure Group, Hill of Towie wind farm data, Zenodo, doi:10.5281/zenodo.14870023 (CC BY 4.0)"
    site:
      name: "Hill of Towie"
      country: "UK"
      oem: "Siemens SWT-2.3-VS-82"
      n_turbines: 21
      rated_kw: 2300
      period: "2016-01..2024-08"
      note: >-
        AeroUp retrofits 2021-2023 and TuneUp 2024 are a built-in regime change;
        install dates are in Hill_of_Towie_AeroUp_install_dates.csv
    # MEASURED 2026-09-10 per station, on labels moved to interval start: UTC across 42
    # station-years (21 turbines, 2019 and 2023), both halves of the daylight-saving test
    # applied, and the power column is kW (median p99.5 2,299 against a rated 2,300).
    # The SCADA TimeStamp labels the END of each 10-minute interval (the turbine clock
    # at the interval's end sits a median 2 s before it); the adapter moves it to the
    # start. Evidence: reports/data/resolved_hill_of_towie_20260910.md.
    timezone: "UTC"
    intended_use: "held-out site; also the temporal-drift axis"
    tiers:
      # One pre-retrofit year and one post-retrofit year is the minimum that lets the
      # regime change be measured; the remaining years are tier 2.
      1:
        - "Hill_of_Towie_tables_description.csv"
        - "Hill_of_Towie_turbine_fields_description.csv"
        - "Hill_of_Towie_grid_fields_description.csv"
        - "Hill_of_Towie_alarms_description.csv"
        - "Hill_of_Towie_turbine_metadata.csv"
        - "Hill_of_Towie_AeroUp_install_dates.csv"
        - "Hill_of_Towie_ShutdownDuration.zip"
        - "2019.zip"
        - "2023.zip"
      2:
        - "2016.zip"
        - "2017.zip"
        - "2018.zip"
        - "2020.zip"
        - "2021.zip"
        - "2022.zip"
        - "2024.zip"

  care:
    provider: "Fraunhofer IEE"
    zenodo_record: 15846963 # v6, published 2025-07-09 (label corrections; not v1)
    concept_doi: "10.5281/zenodo.10958774"
    license: "CC-BY-SA-4.0" # share-alike: see docs/DATA_LICENSES.md
    attribution: "Gueck, Bruns, Dupont, CARE to Compare, Fraunhofer IEE, Zenodo, doi:10.5281/zenodo.10958774 (CC BY-SA 4.0)"
    cite: "Gueck, Bruns, Dupont (2024), CARE to Compare, Data 9(12):138, doi:10.3390/data9120138"
    site:
      name: "CARE farms A/B/C (anonymised)"
      country: "PT / DE"
      oem: "TODO(m1): not published; turbines are anonymised"
      n_turbines: 36
      rated_kw: 0 # TODO(m1): not published per farm
      period: "89 turbine-years"
      note: >-
        farm A is 5 onshore turbines in Portugal, farms B and C are offshore in
        Germany; 86/257/957 features per farm; 95 datasets, 45 with labelled
        anomaly events; event_info files carry event descriptions
    # CLOSED 2026-09-10 as unanswerable by design. The record README states that "the
    # sensor data and time stamps are anonymized". An anonymised timestamp keeps the
    # 10-minute spacing and nothing else, so no timezone can be measured from it and no
    # timezone is claimed. `faultline inspect resolve` tests for a daylight-saving
    # fingerprint, and that test is meaningless here: a shifted calendar has no
    # transition to look for.
    timezone: "not applicable - timestamps anonymised by the provider (record README)"
    # For the same reason CARE is excluded from every absolute-time and seasonal feature
    # (hour of day, day of year, month): those features would read the anonymised
    # calendar as if it were real. Relative time -- spacing, order, steps to an event --
    # is unaffected.
    absolute_time: false
    # Recorded under ADR-0004's rule for republished data, amended 2026-09-10.
    provenance: >-
      Farm A is EDP Open Data republished by Fraunhofer IEE: the record README states
      that "the data for Wind farm A is based on data from the EDP-open data platform".
      The chain is EDP Open Data -> Fraunhofer IEE, CARE to Compare (Zenodo record
      15846963) -> CC BY-SA 4.0, and the CC BY-SA 4.0 licence on the Fraunhofer record
      is the one that governs. Farms B and C are offshore farms in Germany that the
      README gives no upstream for. Farm A can be separated out for a sensitivity check:
      it is its own directory, 22 of 95 datasets and 5 of 36 turbines.
    intended_use: "labelled anomaly events for evaluation and label cross-check"
    tiers:
      1:
        - "CARE_To_Compare.zip"
      2: []
