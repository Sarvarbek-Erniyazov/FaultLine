    year_start: 2003
    year_end: 2025
    robots_basis: "nrc.gov/robots.txt user-agent:* carries no Disallow covering this collection"
    pdf_excluded: true
    # DISABLED, not merely pdf_excluded: measured 2026-09-13 across all 20 published
    # years (2003-2025), every single document link routes through /docs/ (0 native
    # HTML documents of the 118 links found). This collection contributes nothing
    # through the permitted route and is not staged. Named in the roadmap brief and
    # kept in this file, disabled, rather than deleted, so the measurement is
    # traceable to the collection it was made against (ADR-0016).

  # ---------------------------------------------------------------------------------
  # PHMSA pipeline incident narratives (ADR-0016, 2026-09-16). Staged under the rule
  # pre-registered in commit 7542165: the Hazardous Liquid 2010-onward file measured
  # 1,030,940 whitespace tokens in qualifying columns (NARRATIVE alone 894,467;
  # reports/data/phmsa_manual_20260915.md), >= 250,000, so all 2010-onward files are
  # staged. Route: data.transportation.gov's 27nc-rsge attachments, not disallowed by
  # its robots.txt; fetched through NrcTextClient's robots gate (Crawl-delay: 1
  # honoured). Each zip is recorded in the `phmsa` manifest; each non-empty NARRATIVE
  # is one document here. Only NARRATIVE is staged: the other name-qualifying
  # *_DETAILS columns are short "other, specify" fields and closed code sets (e.g.
  # CAUSE_DETAILS, distinct ratio 0.007), not narrative. The flagged-incidents file
  # on www.phmsa.dot.gov stays blocked (403 from three clients) and is not a target.
  # Pre-2010 files are not staged: the rule names 2010-onward only.
  # ---------------------------------------------------------------------------------
  phmsa_incident_narratives:
    kind: socrata_attachments
    enabled: true
    provider: "Pipeline and Hazardous Materials Safety Administration, U.S. Department of Transportation"
    license: "public domain (17 U.S.C. 105); usa.gov public-domain label (http://www.usa.gov/publicdomain/label/1.0/), stated in 27nc-rsge's Socrata metadata"
    attribution: "PHMSA, pipeline incident and accident flat files (2010 to present), via data.transportation.gov dataset 27nc-rsge (public domain)"
    view: "27nc-rsge"
    archive_source: "phmsa"
    narrative_column: "NARRATIVE"
    id_column: "REPORT_NUMBER"
    robots_basis: "data.transportation.gov/robots.txt user-agent:* has no rule matching /api/views/ (Crawl-delay: 1)"
    attachments:
      - asset_id: "1d547e17-2be1-4a32-9958-a1d5a946ade9"
        filename: "Hazardous Liquid Accident Data - January 2010 to present.zip"
        pipeline_type: "hazardous-liquid"
      - asset_id: "fba42a19-f78d-44c9-9a76-4bacfc15fba0"
        filename: "Gas Distribution Incident Data - January 2010 to present.zip"
        pipeline_type: "gas-distribution"
      - asset_id: "2b05c2d8-d14a-4c56-ac1c-7d23a4bc31c8"
        filename: "Gas Transmission & Gathering Incident Data - January 2010 to present.zip"
        pipeline_type: "gas-transmission-gathering"
      - asset_id: "875819a6-d388-4fa9-9962-2f0b53ffac21"
        filename: "Liquefied Natural Gas (LNG) Incident Data - January 2011 to present.zip"
        pipeline_type: "lng"
      - asset_id: "28f0a80f-a155-4294-8d1e-1d46f1237896"
        filename: "Hazardous Liquid Gravity & Reporting-Regulated-Only Jul 2020_present.zip"
        pipeline_type: "hazardous-liquid-gravity-rr"
      - asset_id: "021f4773-ebc0-4abc-8628-9321af069f69"
        filename: "Type R Reporting-Regulated Gas Gathering May 2022 to Present.zip"
        pipeline_type: "gas-gathering-type-r"

  # ---------------------------------------------------------------------------------
  # The status-message code book (ADR-0007's tiny, separately-carded source). Not
  # fetched over the network: pooled from the Kelmarsh and Penmanshiel telemetry
  # event tables already staged for M1, under the licence those records already
  # carry (docs/DATA_LICENSES.md).
  # ---------------------------------------------------------------------------------
  status_code_book:
    kind: status_code_book
    enabled: true
    provider: "Cubico Sustainable Investments Ltd (Kelmarsh and Penmanshiel wind farm status logs)"
    license: "CC BY 4.0 (inherited: the same licence as the Kelmarsh and Penmanshiel telemetry records)"
    attribution: "Cubico Sustainable Investments Ltd, Kelmarsh and Penmanshiel wind farm data, Zenodo, doi:10.5281/zenodo.5841833 and doi:10.5281/zenodo.5946807 (CC BY 4.0)"
    telemetry_sources: [kelmarsh, penmanshiel]

# ------------------------------------------------------------------------------------
# Candidates considered at M2a and not staged. Recorded with the evidence, per
# ADR-0016, rather than silently dropped -- a documented exclusion is a result.
# ------------------------------------------------------------------------------------
excluded_candidates:
  nrc_licensee_event_reports:
    status: blocked
    reason: "the only published full-text access route disallows crawling outright, and there is no bulk listing a manual route could enumerate either"
    evidence: >-
      lersearch.inl.gov/robots.txt (fetched 2026-09-13): "User-agent: *\nDisallow: /"
      with the comment "# Don't index this site". data.gov's own listing for this
      dataset (catalog.data.gov/dataset/u-s-nuclear-plant-licensee-event-reports)
      points at the same search interface and offers no bulk download. ADAMS, the
      other route, moved its public interface from adams.nrc.gov/wba (now NXDOMAIN)
      to adams-search.nrc.gov, a JavaScript single-page application with no
      documented public API as of this check. LERSearch is a case-by-case search
      form, not a listing, so unlike PHMSA there is no "exact file" to name for a
      person to download by hand. Route forward: a written bulk-export request to
      NRC, not something this session can action.

  doe_oe417_disturbance_reports:
    status: excluded
    reason: "thin narrative content once measured, not unreachable -- the earlier record overstated the access barrier and is corrected here"
    evidence: >-
      www.oe.netl.doe.gov resolves to an IPv6-only address (2620:111:a002:153::10:75)
      from the DNS used here; this network has no IPv6 route, so that one host is
      genuinely unreachable. The ORNL OpenEnergyHub mirror (openenergyhub.ornl.gov)
      IS reachable, and its /api/explore/... REST endpoint answered directly on
      2026-09-13 -- but its robots.txt disallows /api/ for the general user agent
      (Allow: /api/ is carved out for Googlebot only), so that query did not comply
      with the mirror's own stated policy. Corrected here rather than repeated: the
      mirror's API is not treated as an open automated route. The data already
      retrieved is kept only as evidence of thinness, not relied on as an ongoing
      route. Measured: 341 rows total, 2023 only (the mirror's own description:
      "for data discovery purposes"); its one text field, alert_criteria, holds 27
      distinct values across all 341 rows -- a closed regulatory code book, not
      narrative (ADR-0001's code-book criterion); every text field combined
      (area_affected, alert_criteria, event_type) totals 9,614 whitespace-delimited
      tokens for the whole dataset.

  nerc_lessons_learned:
    status: excluded
    reason: "the publisher's own robots.txt names Claude specifically for exclusion"
    evidence: >-
      nerc.com/robots.txt (fetched 2026-09-13) sets, for the general user agent,
      `Content-Signal: search=yes,ai-train=no,use=reference` -- an express reservation
      of rights under EU Directive 2019/790 Article 4, by the file's own preamble --
      and separately lists `User-agent: ClaudeBot\nDisallow: /`. NERC is not a federal
      agency (Tier 2), so ADR-0004's default applies regardless; the named exclusion
      removes any question of it.

  iso_rto_operator_notices:
    status: excluded
    reason: "no ISO/RTO checked states a permissive licence for its notices, and the access posture is restrictive where it says anything at all"
    evidence: >-
      Sampled CAISO, PJM, ERCOT and MISO (fetched 2026-09-13). CAISO's robots.txt
      disallows /resources/* (where notices of this kind are typically served).
      ERCOT's robots.txt itself returns HTTP 403. MISO's robots.txt uses the same
      Content-Signal convention as NERC and separately lists
      `User-agent: ClaudeBot\nDisallow: /`. PJM's robots.txt carries no blanket block
      but also no licence statement anywhere checked. None of the four states an
      affirmative permissive licence for operator notices; ADR-0004's default is
      exclusion absent one.

  nrel_osti_technical_reports:
    status: excluded
    reason: "no blanket permissive statement exists; the licence question is per-document and the publishing host for one arm is unreachable"
    evidence: >-
      OSTI.GOV's copyright policy (osti.gov/copyright, per its own FAQ) states
      explicitly that public access does not mean public domain: documents marked
      "U.S. Government Work" are freely reusable, but "for technical reports created
      in the performance of the contract, permission from DOE is required to
      establish and claim copyright" -- i.e. contractor-authored lab reports may be
      copyrighted, and the marking must be checked per document. That check does not
      scale to a corpus acquisition step, and this Tier-2 source requires exactly the
      opposite: a document-level check before use. www.nrel.gov (the other candidate
      host) does not resolve from this network at all.
