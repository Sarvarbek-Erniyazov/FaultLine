# Operator-narrative text sources, version 1 (M2a).
#
# v0 (git history) recorded three research leads, all `enabled: false`, all TODO.
# None of them survived contact with the actual terms and access routes -- see
# `excluded_candidates` below and ADR-0016, which carries the full evidence. This file
# is the schema `src/faultline/download/nrc_text.py` reads; it was never executed by a
# run (every v0 source was disabled), so it is edited in place rather than versioned
# alongside it, the same way `sources_telemetry.yaml` is.
#
# WHAT SURVIVED: two families of documents published by the U.S. Nuclear Regulatory
# Commission on www.nrc.gov, both under 17 U.S.C. 105 (a work of the United States
# federal government carries no domestic copyright), both permitted by
# nrc.gov/robots.txt's general `User-agent: *` rule -- quoted in full below, exactly
# as it reads (fetched 2026-09-13):
#
#   user-agent:*
#   Sitemap: https://www.nrc.gov/sitemapindex.xml
#   Disallow: https://www.nrc.gov/ads.txt/
#   Disallow: https://www.nrc.gov/autodiscover/autodiscover.xml
#   Disallow: https://www.nrc.gov/site-help/search
#   Disallow: https://www.nrc.gov/site-help/search.html
#
#   user-agent: Akamai-SiteSnapshot
#   Disallow: https://www.nrc.gov/docs/
#   ...
#   User-agent: Amazonbot
#   Disallow: /docs/
#
# Only two named crawlers (Akamai-SiteSnapshot, Amazonbot) are disallowed from
# `/docs/`; the general rule is not. In practice `/docs/` -- the ADAMS PDF path --
# returns `403 Access Denied` from the Akamai edge to this project's plain HTTP
# client regardless, measured directly and repeatably, on requests that were not part
# of any burst (a plain HTML page fetched immediately before and after each 403
# returned 200). That is a structural block, not a robots.txt rule, and per the
# 2026-09-13 decision this project does not go around it: every source below fetches
# only documents that stay on nrc.gov outside `/docs/`, and what that excludes is
# measured and named per source, not silently dropped.

version: 1

sources:
  # ---------------------------------------------------------------------------------
  # Event Notification Reports -- native HTML for the whole collection, no /docs/
  # exclusion. One report-day page names one or more events; each event with
  # non-empty "Event Text" is staged as its own document.
  # ---------------------------------------------------------------------------------
  nrc_event_notifications:
    kind: event_notifications
    enabled: true
    provider: "U.S. Nuclear Regulatory Commission"
    license: "public domain (17 U.S.C. 105); works of the U.S. federal government carry no domestic copyright"
    attribution: "U.S. Nuclear Regulatory Commission, Event Notification Reports, nrc.gov (public domain, 17 U.S.C. 105)"
    base_url: "https://www.nrc.gov/reading-rm/doc-collections/event-status/event"
    year_start: 1999
    year_end: 2026
    robots_basis: "nrc.gov/robots.txt user-agent:* carries no Disallow covering this collection"

  # ---------------------------------------------------------------------------------
  # Generic communications. Each collection mixes native-HTML document pages (older)
  # with a redirect to a PDF under /docs/ (newer, an ADAMS accession) -- measured per
  # collection in reports/data/nrc_text_yield_20260913.md. Only the native-HTML
  # documents are staged; pdf_excluded: true records that this is a deliberate,
  # measured omission, not an oversight.
  # ---------------------------------------------------------------------------------
  nrc_info_notices:
    kind: generic_comm
    enabled: true
    provider: "U.S. Nuclear Regulatory Commission"
    license: "public domain (17 U.S.C. 105)"
    attribution: "U.S. Nuclear Regulatory Commission, Information Notices, nrc.gov (public domain, 17 U.S.C. 105)"
    label: "Information Notices"
    index_url: "https://www.nrc.gov/reading-rm/doc-collections/gen-comm/info-notices/index"
    year_start: 1979
    year_end: 2026
    robots_basis: "nrc.gov/robots.txt user-agent:* carries no Disallow covering this collection"
