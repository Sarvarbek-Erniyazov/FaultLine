    label: "Generic Letters"
    index_url: "https://www.nrc.gov/reading-rm/doc-collections/gen-comm/gen-letters/index"
    year_start: 1977
    year_end: 2026
    robots_basis: "nrc.gov/robots.txt user-agent:* carries no Disallow covering this collection"
    pdf_excluded: true

  nrc_reg_issues:
    kind: generic_comm
    enabled: true
    provider: "U.S. Nuclear Regulatory Commission"
    license: "public domain (17 U.S.C. 105)"
    attribution: "U.S. Nuclear Regulatory Commission, Regulatory Issue Summaries, nrc.gov (public domain, 17 U.S.C. 105)"
    label: "Regulatory Issue Summaries"
