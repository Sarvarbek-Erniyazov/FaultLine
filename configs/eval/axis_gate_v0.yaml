# The evaluation-axis gate, version 0. Decision record: docs/DECISIONS.md, ADR-0022, written in the
# same commit as this file (child of 7497aaa), BEFORE any code reads it and before either axis is
# scored for any seed. The ADR-0022 commit hash is recorded inside ADR-0022 by the commit after it.
# F5 may not start until that hash is recorded.
#
# THE RULE (ADR-0022 §4). A candidate axis is EVALUABLE if the ADR-0021 rule -- block-bootstrap 95%
# lower bound on tel_only test AUPRC strictly above that axis's OWN test-split base rate, never the
# training rate -- holds on at least two of the three full-budget tel_only seeds, each scored at the
# checkpoint ADR-0024 selected for it. Both axes are scored and reported in full whatever the result.
#
# Every count below was measured from the window index alone on 2026-09-17 (ADR-0022 §1-§3), with
# no model loaded. tests/evaluation/test_axis_gate.py re-counts them when the shards are present.

version: 0

# The shards in force: quantile_bins_v2.yaml over telemetry_v4.yaml and splits_v3.yaml.
shards: "data/shards/telemetry/quantile_bins_v2_9cd52b65"
splits_config: "configs/data/splits_v3.yaml"

# The project horizon H: the label every probe is trained and scored on
# (configs/train/telemetry_v1.yaml, risk.label), 144 steps, 24 hours.
label: "narrow_within_24h"

# The F3 thinning (ADR-0024 §4, configs/train/paired_control_v0.yaml): every 12th known window of
# each shard's index, offset 0, as load_windows(..., stride=12) takes it. No cap, no random draw.
# Identical for every model scored.
stride: 12

# ADR-0022 §4: the rule's chance level is the scored set's own positive rate, never the training
# natural rate. Under uniform thinning it equals the axis's full-split rate to the fourth decimal.
base_rate_source: "scored_set"

# ADR-0021's interval, unchanged (configs/train/gate_check_v0.yaml, bootstrap).
bootstrap:
  block_steps: 288 # 48 hours, twice the label horizon; a window's end step // 288 within its shard
  replicates: 10000
  seed: 20260916
  confidence: 0.95
  max_discarded_share: 0.01 # above this share of positive-free replicates, the interval is untrusted

# ADR-0022 §4: evaluable on at least 2 of the 3 full-budget tel_only seeds.
seeds: [1, 2, 3]
seeds_required: 2

# ADR-0022 §5: the ADR-0024-selected checkpoint gates; the final-step checkpoint is scored beside it
# on both axes and reported, not gating.
checkpoints:
  gating: "selected"
  reported: ["final_step"]

axes:
  # ADR-0022 §2: in-distribution temporal test split, NOT a shift axis. Carries ADR-0009's caveat on
  # every result, and every result is also reported without the "anemometer defect" events
  # (splits_v3.yaml, report_without_messages).
  temporal:
    shard_keys: ["kelmarsh__test", "penmanshiel__test"]
    cut: "2021-12-31T23:59:59Z" # splits_v3.yaml time.val_until; test is 2022-2024
    windows: 137025
    positives: 5312
    base_rate: 0.0388 # 5,312 / 137,025 = 0.03877
    blocks: 5799 # of 5,800 at stride 1
    positive_blocks: 497 # of 506 at stride 1
    without_messages_label: "narrow_within_24h_without"
    without_messages_windows: 137015
    without_messages_positives: 3331 # base rate 0.0243
  # ADR-0022 §1 and §3: the whole CARE evaluation set, thinned uniformly. No positive enrichment.
  care:
    shard_keys: ["care__test"]
    events: 45 # 12 / 6 / 27 at farms A / B / C; the independent unit (event-level n = 45)
    full_windows: 5166066 # known windows at H, stride 1
    full_positives: 6480 # 144 per event
    full_blocks: 18196
    full_positive_blocks: 72
    windows: 430506
    positives: 540 # 12 per event, all 45 events represented
    base_rate: 0.0013 # 540 / 430,506 = 0.001254; full set 6,480 / 5,166,066 = 0.001254
    blocks: 18193 # of 18,196: the thinning does not cover every block (ADR-0022 §3)
    positive_blocks: 67 # of 72
