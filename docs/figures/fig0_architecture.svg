<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1290" viewBox="0 0 960 1290" font-family="system-ui, sans-serif" font-size="12">
<title>F0. FaultLine architecture: data to token ids to S2 decoder to two heads</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a19"/></marker></defs>
<rect width="960" height="1290" fill="#fcfcfb"/>
<text x="16.0" y="24.0" fill="#1a1a19" font-size="15" font-weight="600">F0. FaultLine architecture: raw data to token ids to the S2 decoder to two heads</text>
<text x="16.0" y="43.0" fill="#5f5e58">Shapes: one 2,048-token window, batch omitted. Study-guide figure; the record is README.md and docs/DECISIONS.md.</text>
<rect x="40" y="64" width="420" height="58" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="250.0" y="88.7" fill="#1a1a19" text-anchor="middle" font-weight="600">Telemetry: 10-minute SCADA</text>
<text x="250.0" y="105.7" fill="#5f5e58" text-anchor="middle">Kelmarsh, Penmanshiel (train, val, test)</text>
<rect x="500" y="64" width="420" height="58" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="710.0" y="80.2" fill="#1a1a19" text-anchor="middle" font-weight="600">Text</text>
<text x="710.0" y="97.2" fill="#5f5e58" text-anchor="middle">status strings (Kelmarsh, Penmanshiel);</text>
<text x="710.0" y="114.2" fill="#5f5e58" text-anchor="middle">NRC and PHMSA narratives (text pretraining)</text>
<line x1="250.0" y1="122" x2="250.0" y2="150" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="710.0" y1="122" x2="710.0" y2="150" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="40" y="150" width="420" height="58" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="250.0" y="166.2" fill="#1a1a19" text-anchor="middle" font-weight="600">Cleaning</text>
<text x="250.0" y="183.2" fill="#5f5e58" text-anchor="middle">plausibility bounds; pitch floored at 0.0°;</text>
<text x="250.0" y="200.2" fill="#5f5e58" text-anchor="middle">power per unit of rated; 12 core of 14 channels</text>
<rect x="500" y="150" width="420" height="58" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="710.0" y="166.2" fill="#1a1a19" text-anchor="middle" font-weight="600">Normalisation</text>
<text x="710.0" y="183.2" fill="#5f5e58" text-anchor="middle">status: lowercase after one space (H3′, ADR-0017);</text>
<text x="710.0" y="200.2" fill="#5f5e58" text-anchor="middle">narratives: emails and phones masked (ADR-0005), dedup</text>
<line x1="250.0" y1="208" x2="250.0" y2="236" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="710.0" y1="208" x2="710.0" y2="236" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="40" y="236" width="420" height="72" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="250.0" y="259.2" fill="#1a1a19" text-anchor="middle" font-weight="600">Quantile-bin tokenizer (v2, fitted on train only)</text>
<text x="250.0" y="276.2" fill="#5f5e58" text-anchor="middle">256 bins per channel; a step = &lt;sep&gt; + 12 bin tokens;</text>
<text x="250.0" y="293.2" fill="#5f5e58" text-anchor="middle">bin id = 96 + local bin; channel = position in step</text>
<rect x="500" y="236" width="420" height="72" rx="6" fill="#ffffff" stroke="#3f8f5b" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="710.0" y="259.2" fill="#1a1a19" text-anchor="middle" font-weight="600">Byte-level BPE (in-repo)</text>
<text x="710.0" y="276.2" fill="#5f5e58" text-anchor="middle">vocabulary 32,768 = 256 bytes + 32,512 merges;</text>
<text x="710.0" y="293.2" fill="#5f5e58" text-anchor="middle">joint id = 1,184 + local id</text>
<text x="44.0" y="330.0" fill="#5f5e58" font-size="11" font-style="italic">144 steps × 13 = 1,872 ids per 24 h</text>
<text x="718.0" y="330.0" fill="#5f5e58" font-size="11" font-style="italic">&lt;txt&gt; … &lt;/txt&gt; spans</text>
<line x1="250.0" y1="308" x2="420.0" y2="346" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="710.0" y1="308" x2="540.0" y2="346" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="40" y="346" width="880" height="58" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="480.0" y="370.7" fill="#1a1a19" text-anchor="middle" font-weight="600">Joint token ids: one vocabulary of 33,952 (ADR-0003 v2)</text>
<text x="480.0" y="387.7" fill="#5f5e58" text-anchor="middle">specials [0, 32) · channel [32, 96) · bin [96, 1120) · time [1120, 1184) · text [1184, 33952)</text>
<line x1="480.0" y1="404" x2="480.0" y2="440" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<text x="490.0" y="426.0" fill="#5f5e58" font-size="11" font-style="italic">[2048] token ids</text>
<rect x="130" y="440" width="700" height="58" rx="6" fill="#ffffff" stroke="#8a5cd0" stroke-width="1.5"/>
<text x="480.0" y="464.7" fill="#1a1a19" text-anchor="middle" font-weight="600">Token embedding 33,952 × 192 (tied to the LM head)</text>
<text x="480.0" y="481.7" fill="#5f5e58" text-anchor="middle">+ learned absolute position embedding 2,048 × 192</text>
<line x1="480.0" y1="498" x2="480.0" y2="548" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<text x="490.0" y="520.0" fill="#5f5e58" font-size="11" font-style="italic">[2048, 192]</text>
<rect x="150" y="548" width="660" height="332" rx="10" fill="#f3f2ee" stroke="#1a1a19" stroke-width="1.5"/>
<text x="164.0" y="570.0" fill="#1a1a19" font-weight="600">× 8 decoder blocks (S2: d_model 192, dropout 0.0, no biases)</text>
<rect x="330.0" y="588" width="300" height="30" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="480.0" y="607.2" fill="#1a1a19" text-anchor="middle">RMSNorm (pre-norm)</text>
<rect x="330.0" y="634" width="300" height="30" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="480.0" y="653.2" fill="#1a1a19" text-anchor="middle">Causal self-attention, 8 heads × 24</text>
<circle cx="480.0" cy="695" r="13" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="480.0" y="700.0" fill="#1a1a19" font-size="14" text-anchor="middle" font-weight="600">+</text>
<text x="502.0" y="699.0" fill="#5f5e58" font-size="11">residual add</text>
<rect x="330.0" y="726" width="300" height="30" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="480.0" y="745.2" fill="#1a1a19" text-anchor="middle">RMSNorm (pre-norm)</text>
<rect x="330.0" y="772" width="300" height="30" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="480.0" y="791.2" fill="#1a1a19" text-anchor="middle">MLP 192 → 768 → 192, GELU</text>
<circle cx="480.0" cy="833" r="13" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="480.0" y="838.0" fill="#1a1a19" font-size="14" text-anchor="middle" font-weight="600">+</text>
<text x="502.0" y="837.0" fill="#5f5e58" font-size="11">residual add</text>
<line x1="480.0" y1="618" x2="480.0" y2="633" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="480.0" y1="664" x2="480.0" y2="679" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="480.0" y1="710" x2="480.0" y2="725" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="480.0" y1="756" x2="480.0" y2="771" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="480.0" y1="802" x2="480.0" y2="817" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M480.0,580 L300.0,580 L300.0,695 L466.0,695" fill="none" stroke="#5f5e58" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#head)"/>
<path d="M480.0,718 L300.0,718 L300.0,833 L466.0,833" fill="none" stroke="#5f5e58" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#head)"/>
<text x="294.0" y="654.0" fill="#5f5e58" font-size="11" text-anchor="end">skip</text>
<text x="294.0" y="792.0" fill="#5f5e58" font-size="11" text-anchor="end">skip</text>
<text x="642.0" y="653.0" fill="#5f5e58" font-size="11" font-style="italic">[2048, 192] in and out</text>
<text x="642.0" y="791.0" fill="#5f5e58" font-size="11" font-style="italic">[2048, 768] inside</text>
<line x1="480.0" y1="880" x2="480.0" y2="916" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="330.0" y="916" width="300" height="36" rx="6" fill="#ffffff" stroke="#1a1a19" stroke-width="1.5"/>
<text x="480.0" y="938.2" fill="#1a1a19" text-anchor="middle">Final RMSNorm</text>
<text x="640.0" y="939.0" fill="#5f5e58" font-size="11" font-style="italic">h: [2048, 192]</text>
<path d="M480.0,952 L480.0,972 L250.0,972 L250.0,1003" fill="none" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M480.0,972 L710.0,972 L710.0,1003" fill="none" stroke="#3f8f5b" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#head)"/>
<text x="258.0" y="992.0" fill="#2a78d6" font-size="11" font-weight="600">A: pretraining</text>
<text x="718.0" y="992.0" fill="#3f8f5b" font-size="11" font-weight="600">B: risk read-out</text>
<rect x="40" y="1004" width="420" height="50" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="250.0" y="1024.7" fill="#1a1a19" text-anchor="middle" font-weight="600">A. Tied LM head: logits = h · Eᵀ</text>
<text x="250.0" y="1041.7" fill="#5f5e58" text-anchor="middle">E is the same 33,952 × 192 token table</text>
<text x="258.0" y="1076.0" fill="#5f5e58" font-size="11" font-style="italic">[2048, 33,952] logits</text>
<line x1="250.0" y1="1054" x2="250.0" y2="1094" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="40" y="1094" width="420" height="50" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="250.0" y="1114.7" fill="#1a1a19" text-anchor="middle" font-weight="600">Next-token cross-entropy</text>
<text x="250.0" y="1131.7" fill="#5f5e58" text-anchor="middle">pretraining objective, 50,003,968 tokens per arm</text>
<text x="258.0" y="1166.0" fill="#5f5e58" font-size="11" font-style="italic">scalar loss</text>
<rect x="500" y="1004" width="420" height="66" rx="6" fill="#ffffff" stroke="#3f8f5b" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="710.0" y="1024.2" fill="#1a1a19" text-anchor="middle" font-weight="600">B. Backbone frozen; one read-out</text>
<text x="710.0" y="1041.2" fill="#5f5e58" text-anchor="middle">(a) final position h_L: [192]</text>
<text x="710.0" y="1058.2" fill="#5f5e58" text-anchor="middle">(d) [h_L; mean over text positions; has-text]: [385]</text>
<line x1="710.0" y1="1070" x2="710.0" y2="1094" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="500" y="1094" width="420" height="50" rx="6" fill="#ffffff" stroke="#3f8f5b" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="710.0" y="1114.7" fill="#1a1a19" text-anchor="middle" font-weight="600">Linear probe → logit → prior correction (ADR-0019)</text>
<text x="710.0" y="1131.7" fill="#5f5e58" text-anchor="middle">balanced training at 0.5, corrected to the natural rate</text>
<text x="718.0" y="1164.0" fill="#5f5e58" font-size="11" font-style="italic">scalar probability</text>
<line x1="710.0" y1="1144" x2="710.0" y2="1184" stroke="#1a1a19" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="500" y="1184" width="420" height="50" rx="6" fill="#ffffff" stroke="#3f8f5b" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="710.0" y="1204.7" fill="#1a1a19" text-anchor="middle" font-weight="600">Paired two-day block-bootstrap AUPRC</text>
<text x="710.0" y="1221.7" fill="#5f5e58" text-anchor="middle">and abstention (ADR-0028)</text>
<line x1="40" x2="74" y1="1256" y2="1256" stroke="#1a1a19" stroke-width="1.5"/>
<text x="82.0" y="1260.0" fill="#5f5e58" font-size="11">solid outline: telemetry path and pretraining (branch A)</text>
<line x1="460" x2="494" y1="1256" y2="1256" stroke="#1a1a19" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="502.0" y="1260.0" fill="#5f5e58" font-size="11">dashed outline: text path and risk read-out (branch B)</text>
