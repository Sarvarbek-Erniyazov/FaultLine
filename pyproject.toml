[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faultline"
version = "0.1.0"
description = "Risk-calibrated joint telemetry-text sequence modeling for cyber-physical event risk under shift"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sarvarbek Erniyazov" }]
keywords = ["sequence-modeling", "wind-energy", "scada", "risk-calibration", "selective-prediction"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]

# Runtime dependencies are limited to what the M0 code actually imports.
# The ported course pipeline needs only the standard library (re, html, unicodedata,
# hashlib, json, collections) -- no ftfy / beautifulsoup4 / lxml / regex is required.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dotenv>=1",
    "huggingface_hub>=0.23",
    "openpyxl>=3.1",
    # M1. The CUDA build is chosen by the index in [tool.uv.sources] below, not by this
    # line, and uv.lock pins the exact wheel. See docs/ENVIRONMENT.md.
    "torch>=2.14,<2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "types-PyYAML",
    "types-requests",
    "types-tqdm",
    "pandas-stubs",
]

[project.scripts]
faultline = "faultline.cli:app"

[project.urls]
Homepage = "https://github.com/Sarvarbek-Erniyazov/FaultLine"
Repository = "https://github.com/Sarvarbek-Erniyazov/FaultLine"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]

# The one supported environment is uv with the committed uv.lock (docs/ENVIRONMENT.md).
[tool.uv]
# The machines this project runs on. macOS is left out because the CUDA index below
# publishes no wheel for it, and a lock that pretends otherwise does not install.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# torch comes from the PyTorch CUDA 13.2 index and from nowhere else. cu132 is the newest
# CUDA build published for torch 2.14 and the newest the recorded driver runs: RTX 4060,
# driver 616.56, CUDA UMD 13.4 (nvidia-smi, 2026-09-10). A driver runs any CUDA runtime
# up to its own version, so cu132 is the build that matches it, not merely one that works.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks/_reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Missing-docstring rules are relaxed for tests and thin script wrappers only.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
"scripts/**" = ["D100", "D103"]

[tool.mypy]
# No python_version pin: the numpy stubs shipped with this lockfile use 3.12 syntax,
# so mypy type-checks against the interpreter in the active environment.
strict = true
files = ["src"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
    "pyarrow.*",
    "openpyxl.*",
    "huggingface_hub.*",
    "dotenv.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# importlib import mode: the text and telemetry suites deliberately share module
# names (test_clean, test_filter, test_pipeline) because they mirror src/, and the
# legacy prepend mode cannot hold two modules with the same name.
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:faultline.*"]
