# ---------------------------------------------------------------------------------------
# Hill of Towie: the downtime series. In v2 it supplies each step's TOTAL downtime; the
# cause comes from harmonised.stop_classes. threshold_s and sensitivity_thresholds_s now
# drive only the Stopping-flag cross-check, and threshold_s must equal
# harmonised.min_duration_s so the two can never drift apart.
# ---------------------------------------------------------------------------------------
downtime:
  sources: [hill_of_towie]
  threshold_s: 60
  sensitivity_thresholds_s: [60, 300, 600]
  cross_check_window_steps: 1

# ---------------------------------------------------------------------------------------
# CARE: event_info, evaluation only. One labelled anomaly per dataset: narrow and broad
# are the same events here, because the provider labels one anomaly and nothing else.
# ---------------------------------------------------------------------------------------
event_info:
  sources: [care]
  fault_labels: [anomaly]

# ---------------------------------------------------------------------------------------
# The harmonised rule (ADR-0009)
# ---------------------------------------------------------------------------------------
harmonised:
  # THE RULE. Narrow (primary) keeps technical stops only; broad (secondary) keeps a
  # stop of any cause. Both drop events shorter than min_duration_s.
  narrow_causes: [technical]
  # 60 s, lowered from v1's 300 s. The described stopping codes at the held-out site
  # agree with its downtime series 99.97% at a 1 s threshold but 63.18% at 300 s
  # (v1 label report): documented stops are short, and 300 s discarded them. What a
  # short stop must NOT be let through for is pitch lubrication (~3 min, filed under
  # turbine error), and that is excluded by cause (code_causes), not by duration.
  min_duration_s: 60
  sensitivity_min_duration_s: [60, 300, 600]

  # The provider status that marks a Senvion row as a stop. Warning rows are not stops,
  # whatever their category; they flow into the status stream as inputs instead.
  stop_status: "Stop"

  # Senvion configured category -> cause. Evidence: the category comments above and in
  # events_v1.yaml. `unmapped` is a string the table does not name: its cause is unknown,
  # so it can enter the broad label and never the narrow one (ADR-0006).
  category_causes:
    equipment_fault: technical
    environmental: environmental
    grid_and_curtailment: grid
    manual_operation: planned
    routine_procedure: planned
    communication: unknown
    equipment_warning: unknown
    normal_operation: unknown
    unmapped: unknown

  # Hill of Towie: the provider's stop-class timers, seconds per 10-minute step, in
  # tblSCTurFlag ("Turbine status information [10min]",
  # Hill_of_Towie_tables_description.csv). Neither ShutdownDuration.csv
  # (TimeStamp_StartFormat, TurbineName, ShutdownDuration) nor tblAlarmLog (TimeOn,
  # TimeOff, StationNr, Alarmcode) carries a cause; this table does.
  #   wtc_ScTurSto_timeon  "Time turbine error active in period" -- the provider's own
  #                        description (Hill_of_Towie_turbine_fields_description.csv).
  #   wtc_ScEnvSto_timeon, wtc_ScComSto_timeon, wtc_ScGrdSto_timeon -- not described by
  #                        the provider. Read as environmental, commanded and grid stops
  #                        from the naming, and from tblDailySummary, which counts the
  #                        same four classes as StopsEnvironmental, StopsCommanded,
  #                        StopsTurbineFault and StopsGridFault. Checked against the
  #                        described codes (label report): high wind (8000) and icing
  #                        (8230) run under Env on 99.1% and 100% of occurrences.
  # Commanded stops are planned: a stop somebody asked for is not a fault.
  stop_classes:
    table: "tblSCTurFlag"
    fields:
      wtc_ScTurSto_timeon: technical
      wtc_ScEnvSto_timeon: environmental
      wtc_ScComSto_timeon: planned
      wtc_ScGrdSto_timeon: grid

  # Hill of Towie described stopping codes (Hill_of_Towie_alarms_description.csv) whose
  # description names a non-technical cause. In a step where one of these alarms is
  # active, the step's turbine-error seconds move to the code's cause. The case that
  # matters: pitch lubrication (3130) runs under ScTurSto on 99.9% of its 2,977
  # occurrences, so the timer alone would call routine lubrication a fault. Order
  # decides a step two codes claim.
  code_causes:
    "3130": planned # Pitch lubrication
    "10105": planned # Stopped, untwisting cables (Senvion: "Cable autounwind", routine)
    "1005": environmental # Availability - low wind
    "8000": environmental # Windspeed too high to operate
    "8210": environmental # Stopped, due to icing
    "8230": environmental # Ice detection: Low torque
    "8234": environmental # Ice detection: No cut in
    "8235": environmental # Ice Detect: Stopped
    "8236": environmental # Ice Detect: Stopped, De-Ice

  # Sensitivity only: these Senvion strings counted as technical instead of their
  # configured category (manual_operation, or unmapped). Normalized as ingest stores
  # them. Hill of Towie describes no emergency-stop code.
  emergency_stop_strings:
    - "emergency stop base box"
    - "emergency stop top box"
    - "emergency stop nacelle"

  # Diagnostic and sensitivity only (apply: false). Under rung (a) of ADR-0009 the cause
  # does the excluding; the wind state of each narrow event is still measured, so the
  # report can say whether wind-lull stops leaked through, and what a wind rule would
  # remove. One envelope for every site, from the data (measured 2026-09-11 on the
  # cleaned grid, wind in the step a stop starts in).
  wind_envelope:
    cut_in_ms: 3.0
    cut_out_ms: 20.0
    apply: false
    provenance: >-
      cut_in_ms: the median wind at the start of each provider's own low-wind stop is
      2.71 m/s (Kelmarsh, 'Wind < start wind', n=57,575), 3.39 (Penmanshiel, n=111,136)
      and 3.86 (Hill of Towie, code 1005, n=2,665); 1% of producing steps (power > 10 kW)
      are below 2.83, 3.67 and 3.21. cut_out_ms: the median at the start of a high-wind
      stop is 22.52 (Kelmarsh 'Max. wind speed', n=4), 22.68 (Penmanshiel, n=3,339) and
      20.70 (Hill of Towie code 8000, n=232); the lowest, rounded down.
