# Event labelling, version 2: one event rule for every site (ADR-0009).
# Read by `faultline telemetry label` through events.labels_config. Never edited after a
# run has read it; a change is events_v3.yaml. events_v1.yaml is left untouched.
#
# What v1 got wrong, measured (reports/data/20260910-141855_label_telemetry_c13b5fe8):
# the held-out site counted 212.6 events per turbine-year against 19.5 and 24.8 at the
# training sites, because the two sides counted different things. Kelmarsh and
# Penmanshiel counted equipment-fault STATUS ROWS; Hill of Towie counted DOWNTIME RUNS
# OF ANY CAUSE, low wind included. Gate 1 decided: narrow the held-out site's events to
# the training definition; do not widen the training sites.
#
# v2 does that in two parts, and keeps them apart:
#
#   1. TRANSLATION, per source (below). Each source's evidence is reduced to one table:
#      seconds of downtime per 10-minute step, split into the causes
#      technical / environmental / grid / planned / unknown (IEC 61400-26 style).
#      Senvion: the configured category of each provider Stop row. Hill of Towie: the
#      provider's four stop-class timers in tblSCTurFlag, with described alarm codes
#      overriding the timer where the code's own description names the cause.
#   2. THE RULE, one for every site (harmonised.narrow_causes, min_duration_s). An event
#      is a run of consecutive steps holding downtime of the chosen causes, lasting at
#      least min_duration_s. Narrow = technical. Broad = any cause. The function that
#      applies it (harmonise.select_events) takes no source argument.
#
# Part 2 changes the training sites too, and that is deliberate: a fault episode that
# the Senvion log writes as three status rows is one event, exactly as a Siemens
# downtime run is one event. Row counts are reported beside episode counts so the
# change is visible, not hidden.

version: 2

# ---------------------------------------------------------------------------------------
