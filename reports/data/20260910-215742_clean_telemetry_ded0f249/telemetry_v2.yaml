# Telemetry pipeline configuration, version 2.
#
# telemetry_v0.yaml and telemetry_v1.yaml are untouched: every report they produced stays
# reproducible from the file it names. v2 changes three things, and nothing else:
#
#   1. SENTINELS (clean.sentinels). Per source and channel, the values a provider writes
#      where it has no reading. They become NaN before duplicates are resolved or bounds
#      applied: a code is not a reading, and neither a bound nor a clip is the right tool
#      for it -- a bound misses a code that sits inside the plausible range, and a clip
#      would turn -273.2 degC into a real-looking -30.
#   2. PLAUSIBILITY BOUNDS, revised from the observed percentiles of every ingested value
#      (pre-bounds, all four sources) plus the physics of the machine class, each with a
#      one-line justification. The percentiles are in reports/data/ranges_<date>.md,
#      generated by `faultline inspect ranges` from the ingested tables. The negative
#      generator speeds (to -71,580 rpm) and the 323.7 degC gear oil are encoding or
#      sensor errors, not extremes, and v2 treats them as such: the stuck code by value,
#      the rest by bound.
#   3. The event labelling file is events_v2.yaml (ADR-0009), and the split specification
#      splits_v1.yaml as settled at M1a step 7.
#
# Coverage is NOT decided here. Whether a core channel is demoted for being mostly
# missing at a site (ADR-0008, point 3) is decided from the step-8 missingness report
# that runs on this configuration, and would be a telemetry_v3.yaml.

telemetry:
  freq: "10min"
  timezone_default: "UTC"

  channels:
    - wind_speed_ms
    - power_kw
    - rotor_speed_rpm
    - generator_speed_rpm
    - pitch_angle_deg
    - nacelle_position_deg
    - wind_direction_deg
    - ambient_temp_c
    - nacelle_temp_c
    - gearbox_bearing_temp_c
    - gearbox_oil_temp_c
    - generator_bearing_temp_c
    - generator_winding_temp_c
    - main_bearing_temp_c

  # Unchanged from v1 (frozen 2026-09-10, ADR-0008).
  core_channels:
    wind_speed_ms: "K/P 'Wind speed (m/s)', signal 1; HoT tblSCTurbine.wtc_AcWindSp_mean, wind speed from the active sensor"
    power_kw: "K/P 'Power (kW)', signal 5, measured kW at Kelmarsh; HoT tblSCTurGrid.wtc_ActPower_mean, active power in kW"
    rotor_speed_rpm: "K/P 'Rotor speed (RPM)', signal 54; HoT tblSCTurbine.wtc_MainSRpm_mean, main shaft rpm"
    generator_speed_rpm: "K/P 'Generator RPM (RPM)', signal 86; HoT tblSCTurbine.wtc_GenRpm_mean"
    pitch_angle_deg: "K/P blade A pitch, signal 80; HoT tblSCTurbine.wtc_PitcPosA_mean, blade A"
    nacelle_position_deg: "K/P 'Nacelle position', signal 3; HoT tblSCTurbine.wtc_NacelPos_mean, yaw angle relative to North"
    wind_direction_deg: "K/P 'Wind direction', signal 2; HoT tblSCTurbine.wtc_ActualWindDirection_mean, published in 2023 only (2019: 0 of 12 months), so half the staged held-out period reads it as missing"
    ambient_temp_c: "K/P 'Nacelle ambient temperature', signal 24 outdoor temp.; HoT tblSCTurTemp.wtc_AmbieTmp_mean"
    nacelle_temp_c: "K/P 'Nacelle temperature', signal 25 inside nacelle; HoT tblSCTurTemp.wtc_NacelTmp_mean"
    gearbox_oil_temp_c: "K/P 'Gear oil temperature', signal 178; HoT tblSCTurTemp.wtc_GeOilTmp_mean"
    generator_bearing_temp_c: "K/P front bearing, signal 119; HoT tblSCTurTemp.wtc_GenBeRTm_mean, drive end (front taken as drive end, an inference)"
    generator_winding_temp_c: "K/P 'Stator temperature 1', signal 22; HoT tblSCTurTemp.wtc_Gen1U1Tm_mean, winding 1U1"
    main_bearing_temp_c: "K/P 'Rotor bearing temp', signal 447; HoT tblSCTurTemp.wtc_MainBTmp_mean, main bearing"

  extended_channels:
    gearbox_bearing_temp_c: "verified absent at both Kelmarsh and Penmanshiel (no gearbox bearing in either signal mapping); HoT publishes four, and tblSCTurTemp.wtc_HSGenTmp_mean is mapped"

  # ---------------------------------------------------------------------------
  # plausibility bounds: values outside become NaN and are counted per channel
  # ---------------------------------------------------------------------------
  # Observed figures are from every ingested value before any bound (K Kelmarsh, P
  # Penmanshiel, H Hill of Towie, C CARE; p99.99 unless stated). Machine temperatures
  # share a floor of -30 degC: none can sit far below the coldest air at these UK and
  # German sites, whose lowest observed ambient is -7 degC.
  bounds:
    # A mean wind cannot be negative (C writes down to -14.9: an encoding); p99.99 is
    # 21.1 K, 31.9 P, 25.4 H, 28.1 C, so 40 keeps every storm. It drops H's 63 readings
    # of 44-52 m/s, every one from turbine T17 in 2019: one anemometer, not a storm.
    wind_speed_ms: { min: 0.0, max: 40.0 }
    # Unchanged from v1: MEASURED at Kelmarsh, 1.1 x the 2,050 kW rating
    # (reports/data/resolved_kelmarsh_20260909.md); observed minima -21 K, -19 P.
    power_kw: { min: -100.0, max: 2255.0 }
    # p99.99 15.3 K, 17.2 P, 17.1 H, 14.9 C: 25 is above any of these rotors' limits and
    # drops K's 19 readings of 27 to 49.9; standstill noise is a fraction of an rpm either
    # side of zero, and C's -5.42 and -5.5 clusters (18,311 and 4,302 rows, all farm C)
    # are codes, not a rotor turning backwards.
    rotor_speed_rpm: { min: -1.0, max: 25.0 }
    # Standstill reads within about -2 to +1 rpm. The -576 rpm clusters at both Senvion
    # sites and P's -71,580 are encoding errors, not a generator running backwards; the
    # upper bound stays above the doubly-fed ceiling (p99.99 1,811 K, 1,812 P, 1,553 H).
    generator_speed_rpm: { min: -10.0, max: 2500.0 }
    # Fine pitch sits at -2.4 to 0 and feathered at 78 (H) to 93.5 (P) degrees; K parks
    # at 98.8 on 119 steps, which 100 keeps. 264, 357.5 and 360 are wrap-around codes.
    pitch_angle_deg: { min: -5.0, max: 100.0 }
    # A full circle; no value outside it at any site.
    nacelle_position_deg: { min: 0.0, max: 360.0 }
    wind_direction_deg: { min: 0.0, max: 360.0 }
    # Air at UK and German offshore sites, and farm A in Portugal: observed -7.0 to 39.3
    # K, -5.4 to 34.3 P, -4.9 to 27.1 H, up to 40 C. Above 50 is not air (C has 90 values
    # above 60, to 70); C's -54.9 and -273.2 are codes, in the sentinel list.
    ambient_temp_c: { min: -30.0, max: 50.0 }
    # Enclosure: observed maxima 42.7 K, 64.9 P, 39.9 H, 51 C.
    nacelle_temp_c: { min: -30.0, max: 70.0 }
    # H p99.99 62.5, C max 72. H's 200 (750 values) and -50 are the sensor's range
    # limits, in the sentinel list.
    gearbox_bearing_temp_c: { min: -30.0, max: 120.0 }
    # Oil runs at 50-60 degC and trips well below 100 (p99.9 59.9 K, 59.9 P, 50.2 H).
    # K's 323.7 (1,595 values) and C's 850 (14,259) are stuck codes, in the sentinel
    # list; C's -1,647 is an encoding error.
    gearbox_oil_temp_c: { min: -30.0, max: 100.0 }
    # Observed maxima 73.9 K, 99.8 P; p99.99 77 H, 88 C. 200 (H) and 205 (C farm A,
    # 961 values) are codes.
    generator_bearing_temp_c: { min: -30.0, max: 120.0 }
    # Insulation class H is rated to 180 degC; p99.99 102 K, 95 P, 99 H, 149 C. P's single
    # 264 and C's 205 and 850 are errors.
    generator_winding_temp_c: { min: -30.0, max: 180.0 }
    # Observed maxima 48.6 K, 42.3 P, 50 H, 63.7 C; C farm B's -87.5 cluster (about 200
    # values) is an error.
    main_bearing_temp_c: { min: -30.0, max: 100.0 }

  bounds_overrides:
    hill_of_towie:
      power_kw: { min: -100.0, max: 2530.0 } # 1.1 x 2300 kW rated (Siemens SWT-2.3-VS-82); p99.99 2,302
    care:
      # Normalised power (channel_map/care.yaml): 1.1 x rated in per-unit; observed -0.04 to 1.07.
      power_kw: { min: -0.1, max: 1.1 }

  clean:
    duplicate_timestamps: "mean"
    apply_bounds: true
    drop_all_nan_rows: false
    # A value is a sentinel when one exact value repeats far outside the channel's
    # distribution, or where no neighbouring value exists. Counted per value in the
    # ranges report; matched within 1e-4 (clean.SENTINEL_TOLERANCE), which absorbs a code
    # exported at single precision.
    sentinels:
      kelmarsh:
        # 1,597 readings of 323.70001220703114 degC -- 323.7 at single precision -- and
        # the next highest reading is 60.8.
        gearbox_oil_temp_c: [323.7]
      hill_of_towie:
        # The sensors' range limits: 750 readings of exactly 200 and a few of -50.
        gearbox_bearing_temp_c: [200.0, -50.0]
        generator_bearing_temp_c: [200.0, -50.0]
      care:
        # -273.2 is absolute zero written as a temperature (1 row, farm B); -54.9 is
        # 4,496 rows at farm C and nothing near it.
        ambient_temp_c: [-273.2, -54.9]
        # Farm C writes exactly 0.0 into gear oil, winding and main bearing on the same
        # 13,184 rows, with no reading within 0.5 of zero otherwise: a fill, not a
        # temperature. 850 (14,259 rows, farm C) and 205 (farm A) are stuck codes.
        gearbox_oil_temp_c: [850.0, 0.0]
        generator_winding_temp_c: [850.0, 205.0, 0.0]
        generator_bearing_temp_c: [205.0]
        main_bearing_temp_c: [0.0]

  filter:
    min_channel_nonnull_frac: 0.50 # provisional; decided from the step-8 missingness report
    min_turbine_year_nonnull_frac: 0.30 # provisional
    segment_break_steps: 6 # provisional: a gap of one hour starts a new segment
    min_segment_steps: 144 # provisional: keep segments of at least one day

  impute:
    max_impute_steps: 3 # provisional: fill gaps up to 30 minutes
    method: "linear"

  events:
    horizons_steps: [6, 36, 144]
    labels_config: "configs/data/events_v2.yaml"
    lowercase_messages: true
    collapse_whitespace: true
    default_is_fault: null

  tokenizer:
    n_bins: 64 # provisional
    sample_rows: 500000 # provisional
    seed: 20260909

  final:
    splits_config: "configs/data/splits_v1.yaml"
    write_masks: true

  report:
    top_n_messages: 20
    percentile_channels: []
